<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PDF → JSON</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 32px; max-width: 640px; margin: auto; }
    .card { border: 1px solid #e5e7eb; border-radius: 14px; padding: 20px; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    label { display: block; font-size: 14px; margin-bottom: 8px; }
    input[type="file"] { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 10px; }
    button { margin-top: 12px; padding: 10px 14px; border: 0; border-radius: 10px; cursor: pointer; background: #111827; color: #fff; font-weight: 600; }
    .hint { color: #6b7280; font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Extrair links de artigos (PDF → JSON)</h1>
    <form id="form" enctype="multipart/form-data">
      <label for="file">Envie um PDF</label>
      <input id="file" name="file" type="file" accept="application/pdf" required />
      <button type="submit">Processar e baixar JSON</button>
      <div class="hint">O download inicia automaticamente.</div>
    </form>
  </div>

  <script>
    const form = document.getElementById("form");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById("file");
      if (!fileInput.files.length) return;

      const fd = new FormData();
      fd.append("file", fileInput.files[0]);

      try {
        const resp = await fetch("/upload", { method: "POST", body: fd });
        if (!resp.ok) {
          let msg = "Falha ao processar o PDF.";
          try {
            const j = await resp.json();
            if (j && j.erro) msg = j.erro;
          } catch (_) {}
          alert(msg);
          return;
        }
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "artigos.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      } catch {
        alert("Erro de rede.");
      }
    });
  </script>
</body>
</html>
